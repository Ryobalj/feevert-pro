# render.yaml - Blueprint kwa ajili ya Render Deployment
# Hii itatengeneza Backend, Frontend, na Database kiotomatiki

services:
  # ============================================
  # BACKEND SERVICE (Django REST API)
  # ============================================
  - type: web
    name: feevert-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py migrate_legacy_email_account
      python manage.py fix_sequences
    # Serves via daphne (ASGI), not gunicorn+wsgi, because the wsgi app
    # can't handle WebSocket upgrade requests at all - the in-app
    # messaging feature (realtime/consumers.py) needs ASGI end-to-end.
    startCommand: daphne -b 0.0.0.0 -p $PORT feevert.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,feevert.co.tz,www.feevert.co.tz
      - key: USE_REDIS
        value: false
      # Never auto-seed on deploy - content is managed via the admin panel
      # on live. seed_data would overwrite/delete those edits. (Belt-and-
      # suspenders alongside the RENDER=true check in core/seed_guard.py.)
      - key: SKIP_SEED_DATA
        value: true
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: mail.feevert.co.tz
      - key: EMAIL_PORT
        value: 465
      - key: EMAIL_USE_TLS
        value: false
      - key: EMAIL_USE_SSL
        value: true
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: info@feevert.co.tz
      - key: EMAIL_TIMEOUT
        value: 8
      - key: EMAIL_SYNC_CRON_SECRET
        generateValue: true
      - key: IMAP_HOST
        value: mail.feevert.co.tz
      - key: IMAP_PORT
        value: 993
      - key: IMAP_USER
        value: info@feevert.co.tz
      - key: IMAP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://feevert-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: feevert-db
          property: connectionString

  # ============================================
  # FRONTEND SERVICE (React Vite)
  # ============================================
  - type: web
    name: feevert-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://feevert-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

# ============================================
# DATABASE (PostgreSQL)
# ============================================
databases:
  - name: feevert-db
    databaseName: feevert
    plan: free